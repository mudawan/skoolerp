# ==============================================================================
# Nginx Reverse Proxy Configuration for Skooler School Fee Management System
# Place in /etc/nginx/sites-available/skooler and symlink to /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name school.yourdomain.com; # Replace with your actual domain or VPS IP

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is generated)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets & SSE (Server-Sent Events) live multi-user streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Disable proxy buffering for real-time SSE updates
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Client IP propagation for audit logs
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Maximum file upload size (for backup restores or student photo imports)
    client_max_body_size 50M;
}

